name: Update Novorossiysk City Data (anvrsk.ru)

on:
  schedule:
    # Запуск каждые 20 минут со смещением от пиковых очередей GitHub (:00, :20, :40)
    - cron: '12,32,52 * * * *'
  workflow_dispatch: # Ручной запуск кнопкой в интерфейсе GitHub

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на запись для авто-коммита data.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pillow

      - name: Run Data Collector Script
        run: |
          python scripts/fetch_data.py

      - name: Commit and push updated data and informer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json informer.png informer-dark.png informer-light.png
          if git diff --staged --quiet; then
            echo "Нет изменений, коммит не требуется."
          else
            git commit -m "Auto-update city data and informer [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
