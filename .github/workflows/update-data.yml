name: Update Novorossiysk City Data (anvrsk.ru)

on:
  schedule:
    # Запуск каждые 20 минут (круглосуточно)
    - cron: '*/20 * * * *'
  workflow_dispatch: # Возможность ручного запуска в 1 клик через интерфейс GitHub

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Для авто-коммита обновленного data.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Data Collector Script
        run: |
          python scripts/fetch_data.py

      - name: Commit and push updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update city data [skip ci]" && git push)
